paths:
  raw: raw
  processed: processed
  wiki: wiki
  inbox: inbox
  database: data/state.db

limits:
  max_download_mb: 50
  max_redirects: 3
  url_timeout_seconds: 20
  max_retries: 3

allowed_extensions:
  document: [.pdf, .epub, .docx, .md, .txt, .html]
  image: [.jpg, .jpeg, .png, .webp]
  audio: [.mp3, .wav, .m4a, .ogg, .oga]
  video: [.mp4, .mov, .mkv, .webm, .avi]

models:
  context_chars: 24000   # chunk size sent to the text model
  keep_alive: 30s        # unload quickly on 8 GB VRAM

transcription:
  model: small
  device: cuda
  compute_type: int8_float16

video:
  frame_interval_seconds: 60
  max_frames: 40   # longer videos widen the interval

telegram:
  media_group_wait_seconds: 2   # wait for the rest of an album before ingesting it
  max_file_mb: 20               # Bot API download limit; larger files use /ingest-local
  reply_max_chars: 3500
  search_results: 5

youtube:
  subtitle_langs: ["en.*", "sl.*", "sr.*"]
  allow_audio_download: false   # set true only for media you may process

search:
  semantic_weight: 0.5   # 0 = keywords only, 1 = embeddings only
  min_semantic: 0.45     # cosine similarity needed for a page with no keyword match
